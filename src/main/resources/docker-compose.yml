version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_spring
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sa_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer_spring
    restart: always
    ports:
      - "8081:8080"

volumes:
  mariadb_data:
